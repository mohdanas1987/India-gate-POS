# CI runs entirely on GitHub-hosted runners with a free Postgres service
# container — no paid CI/CD add-ons required (plan §97).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: igpos
          POSTGRES_PASSWORD: igpos_dev_local
          POSTGRES_DB: igpos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/api
        env:
          IGPOS_DATABASE_URL: postgresql+psycopg://igpos:igpos_dev_local@localhost:5432/igpos_test
          PYTHONPATH: ".:../..:../../integrations"
        run: python -m pytest tests/ -v

  desktop-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/pos/desktop
        run: npm ci
      - name: Typecheck renderer
        working-directory: apps/pos/desktop
        run: npx tsc -b --noEmit
      - name: Typecheck electron main
        working-directory: apps/pos/desktop
        run: npx tsc -p electron/tsconfig.json --noEmit

  # Phase 8.5 gate, P1 (CTO audit of 0cfd8ca, disclosed gap: "security/secret
  # scanning in CI ... not added this pass"). gitleaks scans the diff on a PR
  # and the full history on a push to main, for accidentally committed
  # secrets (API keys, the JWT secret, DB passwords, etc.) — the exact class
  # of mistake a hardcoded-secret POS has already been burned by once (see
  # the Phase 0 audit's hardcoded JWT secret finding). gitleaks-action is
  # free for public repositories (this repo is public per the previous
  # audit) and needs no license key or paid add-on, matching this project's
  # existing "no paid CI/CD add-ons" constraint (plan §97, see the header
  # comment on this file).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
